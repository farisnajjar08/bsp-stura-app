  font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}

/* ---------- device shell ---------- */
#device{
  position:relative;
  width:100%;max-width:440px;
  height:100dvh;
  margin:0 auto;
  background:var(--surface);
  display:flex;flex-direction:column;
  overflow:hidden;
}
@media (min-width:520px) and (min-height:780px){
  body{display:flex;align-items:center;justify-content:center;background:var(--ground);}
  #device{height:min(880px,94dvh);border-radius:26px;box-shadow:var(--shadow);border:1px solid var(--line);}
}

/* ---------- splash ---------- */
#splash{
  position:absolute;inset:0;z-index:50;
  background:var(--blue);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .5s ease;
}
#splash.gone{opacity:0;pointer-events:none;}
#splash img{
  width:150px;height:auto;display:block;
  background:#fff;border-radius:16px;padding:10px 12px;
  transform:scale(.22);
  animation:grow .9s cubic-bezier(.17,.72,.26,1) forwards;
}
@keyframes grow{from{transform:scale(.22);}to{transform:scale(1);}}
@media (prefers-reduced-motion: reduce){
  #splash img{animation:none;transform:scale(1);}
}

/* ---------- onboarding ---------- */
#onboarding{
  position:absolute;inset:0;z-index:40;
  background:var(--surface);
  display:flex;flex-direction:column;
  padding:max(34px, calc(env(safe-area-inset-top) + 18px)) 22px 26px;
  gap:22px;
  overflow-y:auto;
}
#onboarding[hidden]{display:none;}
.ob-head{display:flex;flex-direction:column;gap:6px;}
.ob-step{
  font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);
}
.ob-head h1{
  font-family:Archivo,sans-serif;font-weight:700;
  font-size:25px;line-height:1.15;letter-spacing:-.02em;margin:0;
  text-wrap:balance;
}
.ob-head p{margin:0;font-size:14.5px;color:var(--ink-mid);}
.choices{display:flex;flex-direction:column;gap:10px;}
.choices.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.choice{
  width:100%;text-align:left;
  border:1px solid var(--line-strong);border-radius:12px;
  padding:15px 16px;
  background:var(--surface);
  display:flex;flex-direction:column;gap:2px;
  transition:border-color .14s ease, background .14s ease;
}
.choice:hover,.choice:active{border-color:var(--blue);background:var(--blue-soft);}
.choice .t{font-family:Archivo,sans-serif;font-weight:600;font-size:15px;letter-spacing:-.01em;}
.choices.grid2 .choice .t{font-size:14.5px;}
.choice .s{font-size:12.5px;color:var(--ink-soft);}
.ob-back{
  align-self:flex-start;margin-top:-6px;
  font-size:13.5px;font-weight:600;color:var(--blue-ink);
}

/* ---------- app chrome ---------- */
#app{display:flex;flex-direction:column;height:100%;min-height:0;}
#app[hidden]{display:none;}
.appbar{
  display:flex;align-items:center;gap:11px;
  padding:max(14px, env(safe-area-inset-top)) 18px 12px;
  border-bottom:1px solid var(--line);
  flex:none;
}
.appbar img{
  height:30px;width:auto;display:block;flex:none;
  background:#fff;border-radius:4px;padding:2px 3px;
}
.appbar h2{
  font-family:Archivo,sans-serif;font-size:17px;font-weight:600;
  margin:0;letter-spacing:-.015em;flex:1;
}
.iconbtn{
  width:32px;height:32px;border-radius:8px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line-strong);
  color:var(--ink-soft);font-size:13px;
}
.iconbtn:hover{border-color:var(--blue);color:var(--blue-ink);}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.pane{display:none;padding:14px 18px 22px;flex-direction:column;gap:12px;}
.pane.on{display:flex;}

/* ---------- plan ---------- */
.cohortbar{
  background:var(--blue-soft);border-radius:11px;

  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;text-align:left;
}
.cohortbar .who{font-size:13px;font-weight:600;color:var(--blue-ink);line-height:1.3;}
.cohortbar .chg{font-size:12px;color:var(--blue-ink);opacity:.8;white-space:nowrap;}

.days{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.daybtn{
  text-align:center;padding:8px 0 9px;border-radius:10px;
  border:1px solid var(--line);
  font-size:11px;font-weight:600;color:var(--ink-soft);
}
.daybtn span{
  display:block;font-family:"IBM Plex Mono",monospace;
  font-size:14px;color:var(--ink);font-weight:500;margin-top:2px;
}
.daybtn.on{background:var(--blue);border-color:var(--blue);}
.daybtn.on,.daybtn.on span{color:var(--on-blue);}
.daybtn.dot{position:relative;}

  content:"";position:absolute;top:6px;right:7px;
  width:5px;height:5px;border-radius:50%;background:var(--red);
}
.daybtn.on.dot::after{background:#fff;}

.dayline{

}
.dayline .rule{flex:1;height:1px;background:var(--line);}

.slot{
  display:grid;grid-template-columns:50px 1fr;gap:12px;
  padding:12px 13px;
  background:var(--surface-2);border-radius:11px;
  border-left:3px solid var(--blue);
}
.slot.alert{border-left-color:var(--red);}
.slot.off{border-left-color:var(--line-strong);}
.slot .time{

  font-size:11.5px;line-height:1.45;color:var(--ink-mid);
  font-variant-numeric:tabular-nums;
}
.slot h3{
  margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em;
  font-family:Archivo,sans-serif;line-height:1.25;
}

.slot .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.flag{
  display:inline-block;margin-top:7px;
  font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;

.empty{

.del{

.card{

.card .arrow{font-size:19px;color:var(--blue-ink);flex:none;line-height:1;}

/* ---------- tabs ---------- */
.tabbar{
  display:grid;grid-template-columns:repeat(3,1fr);

.tab{

label.fld{display:flex;flex-direction:column;gap:5px;}

input[type=text],input[type=password],textarea,select{

input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);}
.btn{

.msg{font-size:12.5px;line-height:1.45;padding:9px 11px;border-radius:9px;}
.msg.err{background:var(--red-soft);color:var(--red-ink);}

.chips{display:flex;gap:6px;flex-wrap:wrap;}

}

}
.shield b{color:var(--ink);font-weight:600;}

/* ---------- settings ---------- */
.seg{display:flex;gap:6px;}
.seg button{
  flex:1;text-align:center;border:1px solid var(--line-strong);border-radius:9px;
  padding:9px 0;font-size:13px;color:var(--ink-mid);background:var(--surface);
}
.seg button.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:600;}

/* ---------- reactions ---------- */
.reactions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

    },

  // Startsemester werden aus dem heutigen Datum erzeugt (Semesterwechsel 01.10. / 01.04.),
  // damit die Liste sich jedes Semester von selbst erweitert und nicht gepflegt werden muss.
  function generateCohorts(){
    var FIRST_YEAR = 2023; // WiSe 2023/24 ist die älteste Kohorte
    var now = new Date();
    var y = now.getFullYear(), m = now.getMonth(); // Jan=0 ... Dez=11
    var isWinter, curYear;
    if(m >= 9){ isWinter = true; curYear = y; }          // Okt-Dez: laufendes WiSe
    else if(m <= 2){ isWinter = true; curYear = y - 1; } // Jan-Mar: noch WiSe des Vorjahrs
    else { isWinter = false; curYear = y; }              // Apr-Sep: laufendes SoSe

    var list = [], year = FIRST_YEAR, winter = true, guard = 0;
    while(guard++ < 60){
      if(winter) list.push({id:"ws"+year, label:"WiSe "+year+"/"+String(year+1).slice(2)});
      else list.push({id:"ss"+year, label:"SoSe "+year});
      if(winter === isWinter && year === curYear) break;
      if(winter){ year += 1; winter = false; } else { winter = true; }
    }
    return list;
  }
  var COHORTS = generateCohorts();
  var BLOCKS = [["09:00","12:15"],["13:00","16:15"],["16:30","19:45"]];
  var DAYNAMES = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];
  var DAYSHORT = ["Mo","Di","Mi","Do","Fr"];
  var STURA_PASS = "stura2026";

  // Reaktionen auf StuRa-Mitteilungen: global sichtbar, ein Absenden pro Gerät.
  // Ohne Backend (leer gelassen) laufen die Buttons in einem lokalen Demo-Modus, siehe README.
  var SUPABASE_URL = "";
  var SUPABASE_ANON_KEY = "";
  var REACTIONS = [
    {key:"like", icon:"👍"},
    {key:"heart", icon:"❤️"},
    {key:"meh", icon:"😕"}
  ];

  var HS_POSTS = [
    {by:"Prüfungsamt", title:"Prüfungsanmeldung ab 15. Oktober", body:"Die Anmeldung läuft über TraiNex und endet am 5. November. Eine spätere Anmeldung ist nicht möglich."},
    {by:"Bibliothek", title:"Neue Öffnungszeiten", body:"Montag bis Freitag bis 20 Uhr geöffnet, samstags von 10 bis 16 Uhr."},
    {by:"Studierendensekretariat", title:"Rückmeldung zum Sommersemester", body:"Die Frist endet am 28. Februar. Wer sich nicht zurückmeldet, wird exmatrikuliert."}
  ];

  /* ============ Hilfen ============ */
  function $(id){ return document.getElementById(id); }
  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(txt !== undefined && txt !== null) n.textContent = txt;
    return n;
  }
  function fnv(str){
    var h = 2166136261;
    for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mkRng(seed){
    var s = seed >>> 0;
    return function(){ s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  }
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function pad3(n){ return n < 10 ? "00" + n : n < 100 ? "0" + n : "" + n; }

  function store(key, val){
    try{
      if(val === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, val);
    }catch(e){ return null; }
  }

  /* ============ Gerät (anonym) ============ */
  function uuid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
      var r = Math.random() * 16 | 0, v = c === "x" ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }
  function deviceId(){
    var id = store("bsp_device_id");
    if(!id){ id = uuid(); store("bsp_device_id", id); }
    return id;
  }

  /* ============ Reaktionen ============ */
  var reactionsReady = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
  function reactionHeaders(){
    return { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY };
  }
  function localReactionKey(newsId){ return "bsp_reacted_" + newsId; }
  function myReaction(newsId){ return store(localReactionKey(newsId)); }

  function fetchReactionCounts(newsId){
    if(!reactionsReady) return Promise.resolve(null);
    var url = SUPABASE_URL + "/rest/v1/reaction_counts?news_id=eq." + encodeURIComponent(newsId);
    return fetch(url, { headers: reactionHeaders() }).then(function(r){
      if(!r.ok) throw new Error("count fetch failed");
      return r.json();
    }).then(function(rows){
      var counts = {};
      rows.forEach(function(row){ counts[row.reaction] = row.n; });
      return counts;
    }).catch(function(){ return null; });
  }

  function sendReaction(newsId, key){
    if(myReaction(newsId)) return Promise.resolve(false);
    store(localReactionKey(newsId), key); // sofort sperren, auch wenn der Server nicht erreichbar ist
    if(!reactionsReady) return Promise.resolve(true);
    var url = SUPABASE_URL + "/rest/v1/reactions";
    var headers = reactionHeaders();
    headers["Content-Type"] = "application/json";
    headers["Prefer"] = "return=minimal";
    return fetch(url, {
      method: "POST", headers: headers,
      body: JSON.stringify({ news_id: newsId, device_id: deviceId(), reaction: key })
    }).then(function(r){
      // 409 = dieses Gerät hat für diese Mitteilung schon abgestimmt (Primary-Key-Konflikt) — kein Fehler
      return true;
    }).catch(function(){ return true; });
  }

  /* ============ Woche ============ */
  function monday(d){
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var wd = x.getDay();
    var diff = (wd === 0 ? -6 : 1 - wd);
    x.setDate(x.getDate() + diff);
    return x;
  }
  var TODAY = new Date();
  var MON = monday(TODAY);
  var WEEK = [];
  for(var i=0;i<5;i++){
    var d = new Date(MON.getFullYear(), MON.getMonth(), MON.getDate() + i);
    WEEK.push(d);
  }
  function todayIdx(){
    for(var i=0;i<5;i++){
      if(WEEK[i].getDate() === TODAY.getDate() && WEEK[i].getMonth() === TODAY.getMonth() && WEEK[i].getFullYear() === TODAY.getFullYear()) return i;
    }
    return 0;
  }

  /* ============ Stundenplan erzeugen ============ */
  function buildPlan(progKey, cohortId){
    var prog = PROGRAMS[progKey];
    var cIdx = 0;
    for(var k=0;k<COHORTS.length;k++){ if(COHORTS[k].id === cohortId) cIdx = k; }
    var rnd = mkRng(fnv(progKey + "|" + cohortId));
    var offset = cIdx * 2; // fest pro Kohorte, unabhängig von der (wachsenden) Listenlänge
    var pool = [];
    for(var j=0;j<prog.courses.length;j++){
      pool.push(prog.courses[(j + offset) % prog.courses.length]);
    }

    var week = [], used = 0;
    for(var day=0; day<5; day++){
      var count = rnd() < 0.32 ? 1 : 2;
      if(day === 4 && rnd() < 0.5) count = 1;
      var blocks = [0,1,2];
      var sessions = [];
      for(var s=0; s<count; s++){
        var bi = Math.floor(rnd() * blocks.length);
        var block = blocks.splice(bi,1)[0];
        var course = pool[used % pool.length]; used++;
        var room = 1 + Math.floor(rnd() * 28);
        sessions.push({
          from: BLOCKS[block][0],
          to: BLOCKS[block][1],
          block: block,
          course: course,
          room: "Raum " + pad3(room),
          status: null,
          prev: null
        });
      }
      sessions.sort(function(a,b){ return a.block - b.block; });
      week.push(sessions);
    }

    // zwei Beispieländerungen in dieser Woche
    var flat = [];
    for(var dd=0; dd<5; dd++){
      for(var ss=0; ss<week[dd].length; ss++) flat.push({d:dd, s:ss});
    }
    if(flat.length > 2){
      var a = flat[Math.floor(rnd()*flat.length)];
      var tgt = week[a.d][a.s];
      var newRoom = 1 + Math.floor(rnd() * 28);
      tgt.prev = tgt.room;
      tgt.room = "Raum " + pad3(newRoom);
      tgt.status = "moved";

      var b = flat[Math.floor(rnd()*flat.length)];
      if(b.d !== a.d || b.s !== a.s){ week[b.d][b.s].status = "cancelled"; }
    }
    return week;
  }

  /* ============ Zustand ============ */

    prog: store("bsp_prog"),
    cohort: store("bsp_cohort"),
    tab: "plan",
    day: todayIdx(),
    plan: null,

  /* ============ Onboarding ============ */

  /* ============ Rendering: Plan ============ */
  function renderPlan(){
    var pane = $("pane-plan");
    pane.innerHTML = "";

    var prog = PROGRAMS[state.prog];
    var cohortLabel = "";
    for(var i=0;i<COHORTS.length;i++){ if(COHORTS[i].id === state.cohort) cohortLabel = COHORTS[i].label; }

    var bar = el("button","cohortbar");
    bar.type = "button";
    var who = el("div","who");
    who.appendChild(document.createTextNode(prog.name));
    who.appendChild(document.createElement("br"));
    who.appendChild(document.createTextNode("Start " + cohortLabel));
    bar.appendChild(who);
    bar.appendChild(el("span","chg","ändern"));
    bar.addEventListener("click", function(){
      obStage = 1; renderOnboarding();
      $("app").hidden = true; $("onboarding").hidden = false;
    });
    pane.appendChild(bar);

    var days = el("div","days");
    for(var d=0; d<5; d++){
      (function(d){
        var hasChange = false;
        for(var s=0;s<state.plan[d].length;s++){ if(state.plan[d][s].status) hasChange = true; }
        var b = el("button","daybtn" + (d === state.day ? " on" : "") + (hasChange ? " dot" : ""));
        b.type = "button";
        b.appendChild(document.createTextNode(DAYSHORT[d]));
        b.appendChild(el("span", null, pad(WEEK[d].getDate())));
        b.addEventListener("click", function(){ state.day = d; renderPlan(); });
        days.appendChild(b);
      })(d);
    }
    pane.appendChild(days);

    var sessions = state.plan[state.day];
    var line = el("div","dayline");
    line.appendChild(document.createTextNode(
      DAYNAMES[state.day] + ", " + WEEK[state.day].getDate() + ". " +
      ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][WEEK[state.day].getMonth()]
    ));
    line.appendChild(el("span","rule"));
    line.appendChild(document.createTextNode(sessions.length === 1 ? "1 Termin" : sessions.length + " Termine"));
    pane.appendChild(line);

    if(!sessions.length){
      pane.appendChild(el("div","empty","Heute keine Veranstaltungen."));
    }
    sessions.forEach(function(s){
      var cls = "slot" + (s.status === "moved" ? " alert" : s.status === "cancelled" ? " off" : "");
      var row = el("div", cls);
      var t = el("div","time");
      t.appendChild(document.createTextNode(s.from));
      t.appendChild(document.createElement("br"));
      t.appendChild(document.createTextNode(s.to));
      row.appendChild(t);
      var body = el("div");
      body.appendChild(el("h3", null, s.course));
      body.appendChild(el("div","meta", "Siemensvilla · " + s.room));
      if(s.status === "moved") body.appendChild(el("span","flag","Raum geändert · vorher " + s.prev.replace("Raum ","")));
      if(s.status === "cancelled") body.appendChild(el("span","flag","Fällt aus"));
      row.appendChild(body);
      pane.appendChild(row);
    });

    pane.appendChild(el("div","note","Beispieldaten zur Demonstration · verbindlich ist TraiNex"));
  }

  /* ============ Rendering: StuRa ============ */
  function fmtDate(iso){
    var d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    var M = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
    return d.getDate() + ". " + M[d.getMonth()] + " " + d.getFullYear() + ", " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + " Uhr";
  }

  function renderReactions(container, newsId){
    var bar = el("div","reactions");
    var mine = myReaction(newsId);
    var counters = {};
    REACTIONS.forEach(function(r){
      var b = el("button","react-btn" + (mine === r.key ? " on" : ""));
      b.type = "button";
      b.disabled = !!mine;
      b.appendChild(el("span", null, r.icon));
      var n = el("span","n");
      b.appendChild(n);
      b.addEventListener("click", function(){
        if(myReaction(newsId)) return;
        Array.prototype.forEach.call(bar.querySelectorAll(".react-btn"), function(x){ x.disabled = true; });
        b.className = "react-btn on";
        var curN = parseInt(n.textContent, 10); if(isNaN(curN)) curN = 0;
        n.textContent = String(curN + 1);
        sendReaction(newsId, r.key);
      });
      counters[r.key] = n;
      bar.appendChild(b);
    });
    container.appendChild(bar);
    if(!reactionsReady){
      container.appendChild(el("div","react-hint","Zählung folgt, sobald die Anbindung eingerichtet ist"));
      return;
    }
    fetchReactionCounts(newsId).then(function(counts){
      if(!counts) return;
      Object.keys(counts).forEach(function(k){ if(counters[k]) counters[k].textContent = String(counts[k]); });
    });
  }

    an.appendChild(el("span","arrow","›"));

    pane.appendChild(an);

  /* ============ Sheet ============ */
  function openSheet(build){

    build(body);
    $("sheet").hidden = false;

  /* ============ Einstellungen ============ */
  function applyTheme(mode){
    if(mode === "light" || mode === "dark"){
      document.documentElement.setAttribute("data-theme", mode);
      store("bsp_theme", mode);
    } else {
      document.documentElement.removeAttribute("data-theme");
      try{ localStorage.removeItem("bsp_theme"); }catch(e){}
    }
  }
  function currentThemeMode(){
    var t = store("bsp_theme");
    return (t === "light" || t === "dark") ? t : "system";
  }

  function openSettings(){
    openSheet(function(b){
      b.appendChild(el("h3", null, "Einstellungen"));

      var themeLab = el("label","fld");
      themeLab.appendChild(el("span", null, "Erscheinungsbild"));
      var seg = el("div","seg");
      var cur = currentThemeMode();
      [["system","System"],["light","Hell"],["dark","Dunkel"]].forEach(function(o){
        var bt = el("button", o[0] === cur ? "on" : "", o[1]);

          applyTheme(o[0] === "system" ? null : o[0]);

        seg.appendChild(bt);

      var cl = el("button","btn ghost","Schließen");
      cl.type = "button";

      b.appendChild(cl);

  function openAdmin(){
    if(state.admin){
      openSheet(function(b){
        b.appendChild(el("h3", null, "StuRa-Zugang aktiv"));
        b.appendChild(el("p","sub","Du kannst Mitteilungen veröffentlichen und löschen."));
        var out = el("button","btn ghost","Abmelden");

        out.addEventListener("click", function(){

        b.appendChild(out);
        var cl = el("button","btn ghost","Schließen");
        cl.type = "button";
        cl.addEventListener("click", closeSheet);
        b.appendChild(cl);
      });
      return;
    }
    openSheet(function(b){
      b.appendChild(el("h3", null, "StuRa-Zugang"));
      b.appendChild(el("p","sub","Nur für den Vorstand. Mit dem Zugang kannst du Mitteilungen veröffentlichen."));
      var lab = el("label","fld");
      lab.appendChild(el("span", null, "Kennwort"));
      var inp = document.createElement("input");
      inp.type = "password"; inp.autocomplete = "off";
      lab.appendChild(inp);
      b.appendChild(lab);
      var err = el("div","msg err");
      err.hidden = true;
      b.appendChild(err);
      var go = el("button","btn","Anmelden");
      go.type = "button";
      function tryLogin(){
        if(inp.value === STURA_PASS){
          state.admin = true;
          try{ sessionStorage.setItem("bsp_admin","1"); }catch(e){}
          closeSheet(); renderStuRa(); syncAdminBtn();
        } else {
          err.textContent = "Kennwort stimmt nicht.";
          err.hidden = false;
        }
      }
      go.addEventListener("click", tryLogin);
      inp.addEventListener("keydown", function(e){ if(e.key === "Enter") tryLogin(); });
      b.appendChild(go);
      var cl = el("button","btn ghost","Abbrechen");
      cl.type = "button";
      cl.addEventListener("click", closeSheet);
      b.appendChild(cl);
      setTimeout(function(){ inp.focus(); }, 60);
    });
  }

  function openCompose(){
    openSheet(function(b){
      b.appendChild(el("h3", null, "Neue Mitteilung"));
      b.appendChild(el("p","sub","Sichtbar für alle, die die App öffnen."));

      var l1 = el("label","fld");
      l1.appendChild(el("span", null, "Überschrift"));
      var t = document.createElement("input"); t.type = "text"; t.maxLength = 90;
      l1.appendChild(t); b.appendChild(l1);

      var l2 = el("label","fld");
      l2.appendChild(el("span", null, "Text"));
      var x = document.createElement("textarea"); x.maxLength = 1800;
      l2.appendChild(x); b.appendChild(l2);

      var msg = el("div","msg err"); msg.hidden = true;
      b.appendChild(msg);

      var go = el("button","btn","Veröffentlichen");
      go.type = "button";
      go.addEventListener("click", function(){
        var title = t.value.trim();
        if(!title){
          msg.className = "msg err";
          msg.textContent = "Bitte gib eine Überschrift ein.";
          msg.hidden = false; return;
        }
        go.disabled = true; go.textContent = "Wird veröffentlicht…";
        msg.hidden = true;
        var next = state.news.slice();
        next.unshift({
          id: "n" + Date.now().toString(36),
          title: title,
          body: x.value.trim(),
          ts: new Date().toISOString()
        });
        publish(next).then(function(){
          msg.className = "msg ok";
          msg.textContent = "Veröffentlicht. Die App lädt gleich neu.";
          msg.hidden = false;
        }).catch(function(e){
          go.disabled = false; go.textContent = "Veröffentlichen";
          msg.className = "msg err";
          msg.textContent = e && e.message ? e.message : "Veröffentlichen nicht möglich.";
          msg.hidden = false;
        });
      });
      b.appendChild(go);
      var cl = el("button","btn ghost","Abbrechen");
      cl.type = "button"; cl.addEventListener("click", closeSheet);
      b.appendChild(cl);
      setTimeout(function(){ t.focus(); }, 60);
    });
  }

  function confirmDelete(id, title){
    openSheet(function(b){
      b.appendChild(el("h3", null, "Mitteilung löschen?"));
      b.appendChild(el("p","sub", title));
      var msg = el("div","msg err"); msg.hidden = true; b.appendChild(msg);
      var go = el("button","btn","Löschen");
      go.type = "button";
      go.addEventListener("click", function(){
        go.disabled = true; go.textContent = "Wird gelöscht…";
        var next = state.news.filter(function(n){ return n.id !== id; });
        publish(next).catch(function(e){
          go.disabled = false; go.textContent = "Löschen";
          msg.className = "msg err";
          msg.textContent = e && e.message ? e.message : "Löschen nicht möglich.";
          msg.hidden = false;
        });
      });
      b.appendChild(go);
      var cl = el("button","btn ghost","Abbrechen");
      cl.type = "button"; cl.addEventListener("click", closeSheet);
      b.appendChild(cl);
    });
  }

  function openAnliegen(){
    openSheet(function(b){
      b.appendChild(el("h3", null, "Anliegen an den StuRa"));
      b.appendChild(el("p","sub","Sag uns, was dich stört oder was besser laufen könnte."));

      var kind = "Problem";
      var chips = el("div","chips");
      ["Anregung","Idee","Problem"].forEach(function(k){
        var c = el("button","chip" + (k === kind ? " on" : ""), k);
        c.type = "button";
        c.addEventListener("click", function(){
          kind = k;
          Array.prototype.forEach.call(chips.children, function(n){ n.className = "chip"; });
          c.className = "chip on";
        });
        chips.appendChild(c);
      });
      var lk = el("label","fld");
      lk.appendChild(el("span", null, "Worum geht es?"));
      lk.appendChild(chips);
      b.appendChild(lk);

      var l2 = el("label","fld");
      l2.appendChild(el("span", null, "Dein Anliegen"));
      var x = document.createElement("textarea");
      x.placeholder = "Zum Beispiel: Nach den Vorlesungen gibt es keinen Ort, an dem man bleiben kann.";
      l2.appendChild(x); b.appendChild(l2);

      var sh = el("div","shield");
      var bb = el("b", null, "Vollständig anonym.");
      sh.appendChild(bb);
      sh.appendChild(document.createTextNode(" Keine Anmeldung, keine Matrikelnummer, keine IP-Adresse."));
      b.appendChild(sh);

      var msg = el("div","msg ok"); msg.hidden = true; b.appendChild(msg);

      var go = el("button","btn","Absenden");
      go.type = "button";
      go.addEventListener("click", function(){
        msg.textContent = "In dieser Demo-Version wird dein Anliegen noch nicht übertragen. In der Vollversion geht es direkt an den StuRa.";
        msg.hidden = false;
        go.disabled = true;
      });
      b.appendChild(go);
      var cl = el("button","btn ghost","Schließen");
      cl.type = "button"; cl.addEventListener("click", closeSheet);
      b.appendChild(cl);
    });
  }

  /* ============ Veröffentlichen ============ */
  function publish(nextNews){
    if(!state.artifact){
      return Promise.reject(new Error("In dieser Fassung können Mitteilungen nicht direkt veröffentlicht werden."));
    }
    return fetch(location.href, {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("Seite konnte nicht gelesen werden.");
      return r.text();
    }).then(function(html){
      var re = /(<script type="application\/json" id="stura-news">)([\s\S]*?)(<\/script>)/;
      if(!re.test(html)) throw new Error("Datenbereich nicht gefunden.");
      var json = JSON.stringify(nextNews).replace(/</g, "\\u003c");
      html = html.replace(re, function(m, a, mid, c){ return a + json + c; });
      return state.artifact.publish(html);
    }).catch(function(e){
      var code = e && e.code;
      if(code === "not_writer" || code === "not_granted" || code === "consent_required"){
        throw new Error("Dieser Zugang darf die App nicht ändern. Veröffentlichen geht nur vom StuRa-Konto aus.");
      }
      if(code === "conflict"){ return; }
      if(code === "rate_limited"){ throw new Error("Zu viele Änderungen kurz hintereinander. Bitte kurz warten."); }
      if(code === "too_large"){ throw new Error("Die Mitteilung ist zu lang."); }
      throw (e instanceof Error ? e : new Error("Veröffentlichen nicht möglich."));
    });
  }

  function syncAdminBtn(){
    $("adminBtn").hidden = (state.tab !== "stura");
    $("adminBtn").style.borderColor = state.admin ? "var(--blue)" : "";
    $("adminBtn").style.color = state.admin ? "var(--blue-ink)" : "";
  }

  /* ============ Tabs ============ */
  var TITLES = { plan:"Mein Plan", hs:"Hochschule", stura:"StuRa" };
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(btn){
    btn.addEventListener("click", function(){
      var t = btn.getAttribute("data-tab");
      state.tab = t;
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
        b.className = "tab" + (b === btn ? " on" : "");
      });
      Array.prototype.forEach.call(document.querySelectorAll(".pane"), function(p){
        p.className = "pane" + (p.id === "pane-" + t ? " on" : "");
      });
      $("barTitle").textContent = TITLES[t];
      document.querySelector("main").scrollTop = 0;
      syncAdminBtn();
    });
  });
  $("adminBtn").addEventListener("click", openAdmin);
  $("settingsBtn").addEventListener("click", openSettings);

  /* ============ Start ============ */
  function startApp(){
    state.plan = buildPlan(state.prog, state.cohort);
    state.day = todayIdx();
    renderPlan(); renderHS(); renderStuRa();
    $("onboarding").hidden = true;
    $("app").hidden = false;
    syncAdminBtn();
  }

  function afterSplash(){
    if(state.prog && state.cohort){ startApp(); }
    else { obStage = 1; renderOnboarding(); $("onboarding").hidden = false; }
  }

  var reduce = false;
  try{ reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  var holdStart = reduce ? 150 : 900;   // Logo ist gewachsen
  setTimeout(function(){
    setTimeout(function(){                // 1 Sekunde stehen lassen
      $("splash").className = "gone";
      afterSplash();
      setTimeout(function(){ var s = $("splash"); if(s && s.parentNode) s.parentNode.removeChild(s); }, 600);
    }, 1000);
  }, holdStart);

})();
</script>
